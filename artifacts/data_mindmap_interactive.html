<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>P-Zerø Data Mindmap</title>
  <style>
    :root {
      --bg: #0b1320;
      --panel: #111d31;
      --text: #e8eef8;
      --muted: #9fb2cf;
      --line: #2a3a55;
      --green: #28c76f;
      --yellow: #ffb020;
      --red: #ea5455;
      --link-blocks: #f66;
      --link-enables: #4cc38a;
      --link-impacts: #6fb5ff;
      --link-depends: #ffb86b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 10%, #13213a 0%, var(--bg) 52%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: 100vh;
    }
    .canvas-wrap {
      position: relative;
      border-right: 1px solid var(--line);
    }
    .controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(10, 18, 30, 0.84);
      border: 1px solid #2d4263;
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .controls button {
      border: 1px solid #36537c;
      background: #1a2b45;
      color: var(--text);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .controls button:hover {
      background: #223a5f;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    svg.dragging {
      cursor: grabbing;
    }
    .node {
      cursor: pointer;
      transition: opacity 120ms ease;
    }
    .node circle {
      stroke: #0f1726;
      stroke-width: 1.2;
    }
    .node.task circle {
      stroke-width: 0.9;
    }
    .node text {
      fill: var(--text);
      font-size: 11px;
      paint-order: stroke;
      stroke: #0a1321;
      stroke-width: 2;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .edge {
      stroke: #3b5b83;
      stroke-width: 1.2;
      fill: none;
      opacity: 0.5;
    }
    .edge.rel {
      stroke-width: 1.8;
      stroke-dasharray: 5 4;
      opacity: 0.9;
      cursor: pointer;
    }
    .side {
      background: linear-gradient(180deg, rgba(17,29,49,0.96), rgba(9,16,28,0.96));
      padding: 14px;
      overflow: auto;
    }
    .side h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #87a0c7;
      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .text {
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      margin: 0;
    }
    .chip {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      margin-right: 6px;
      margin-bottom: 6px;
      border: 1px solid transparent;
    }
    .chip.green { color: #0d2b18; background: #6be49b; border-color: #59d88c; }
    .chip.yellow { color: #3f2a02; background: #ffd27a; border-color: #f5c363; }
    .chip.red { color: #3b0d0f; background: #ff9d9d; border-color: #f48b8b; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 50;
      max-width: 320px;
      background: rgba(12, 21, 36, 0.95);
      border: 1px solid #355177;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      display: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

  <script>
    const DATA = {"entities": [{"id": "prd_pzero", "type": "product", "name": "P-Zerø", "product_id": "prd_pzero", "category_id": null, "parent_id": null, "health": "yellow", "current_state": "P-Zerø is operational end-to-end: training uses a stacked-ensemble workflow (parallel XGB/LGBM families), inference is deployed on AWS Lambda via SAM/CloudFormation with dev/prod environments plus local SAM emulation, outputs are queryable through inference datalake tooling, and operators have dedicated utilities for weather extraction, Athena QA, submission diagnostics, and SHAP explainability. Product maturity is still uneven: critical controls for immutable data/model lineage, standardized experiment and tool conventions, schedule activation and automation discipline, deployment/config consistency, and full commercial/operational governance are not yet uniformly enforced across the lifecycle.", "target_state": "Reproducible, observable, and commercially scalable forecasting platform.", "full_context": {"product": "P-Zerø", "description": "P-Zerø is an end-to-end wind power forecasting product operating across data ingestion, feature engineering, model training, deployment, inference delivery, monitoring, evaluation, and customer-facing business operations. The current platform combines stacked-ensemble modeling (parallel XGB/LGBM families), SAM-based serverless deployment (local emulation plus dev/prod cloud stacks), multi-path inference execution (API and scheduler-driven runs), inference datalake storage, and a practical tooling suite for Meteomatics extraction, Athena inspection, submission quality checks, and SHAP explainability diagnostics. The architecture is functional in production and supports real operational workflows, but product maturity remains uneven in governance-critical areas: immutable data/model lineage, standardized experiment and tooling contracts, schedule/automation rigor, deployment configuration consistency, and fully integrated commercial controls. This node should be read as the product-level synthesis of those subsystem states: strong delivery capability with clear scalability headroom dependent on tightening lifecycle controls and cross-layer standardization.", "current_problem": "Infrastructure and lifecycle practices are fragmented.", "impact": "Scaling and reproducibility are constrained.", "target": "Single product intelligence source of truth.", "importance": "Critical"}}, {"id": "cat_infra", "type": "category", "name": "Infrastructure & Deployment", "product_id": "prd_pzero", "category_id": "cat_infra", "parent_id": "prd_pzero", "health": "green", "current_state": "Serverless runtime for forecasting that happens in AWS Lambda instances. These instances are created from the site repos in the sylvan github account and uses AWS SAM to build and deploy to AWS Infrastructure account. Additional deployment context: developer mode runs local SAM emulation (`sam local invoke`) with event/env files; cloud deployment uses one parameterized SAM template with `DeploymentEnv` restricted to `dev` and `prod`; post-deploy runtime supports API (`POST /forecast`) plus scheduled daily and weekly inference paths through Step Functions to Lambda.", "target_state": "Unified and reliable deployment foundations.", "full_context": {"description": "The method used to deliver forecasts accurately and reliably to the customer/ESKOM/NTCSA. Strengths include clear dev/prod stack separation, shared IaC template usage across environments, image-based Lambda packaging for heavy Python dependencies, and multiple invocation patterns in one stack. Current limitations include only two deployment environments, schedule triggers disabled by default, manual deployment flow, and configuration inconsistencies that increase operational risk."}}, {"id": "cat_data", "type": "category", "name": "Data Management", "product_id": "prd_pzero", "category_id": "cat_data", "parent_id": "prd_pzero", "health": "red", "current_state": "Inference data works; versioning and lineage are weak. The inference side is fed by API and scheduled execution modes from SAM-deployed infrastructure, and datalake access is supported by Athena tooling, but tighter lineage and environment-aware partitioning conventions are still needed.", "target_state": "Versioned and traceable data lifecycle.", "full_context": {"product": "P-Zerø", "category": "Data Management", "description": "Data storage, versioning, and lineage across model lifecycle. Scope includes inference datalake outputs from API and scheduled inference jobs, training data storage, and the governance controls required to trace data end-to-end across dev/prod operations.", "current_problem": "No robust dataset versioning or lineage.", "impact": "Experimentation and reproducibility blocked.", "target": "Immutable, traceable dataset lifecycle.", "importance": "Critical"}}, {"id": "cat_modeling", "type": "category", "name": "Modeling & Training", "product_id": "prd_pzero", "category_id": "cat_modeling", "parent_id": "prd_pzero", "health": "yellow", "current_state": "Model training is operationalized as a stacked-ensemble workflow with parallel XGB and LGBM families, but lifecycle controls (feature activation discipline, version lineage, and standardized experiment governance) are still uneven.", "target_state": "Governed and versioned model lifecycle.", "full_context": {"product": "P-Zerø", "category": "Modeling & Training", "description": "End-to-end model training and forecasting lifecycle built around weather-model-specific base learners and a meta-learner ensemble, with shared preprocessing, time-ordered validation, diagnostics, artifact packaging, and deployment promotion flow.", "current_problem": "Model artifacts not consistently versioned.", "impact": "Rollback and comparison risk.", "target": "Model registry and reproducible training.", "importance": "Critical"}}, {"id": "cat_experiment", "type": "category", "name": "Experimentation & Development", "product_id": "prd_pzero", "category_id": "cat_experiment", "parent_id": "prd_pzero", "health": "red", "current_state": "Experimentation now has an active temporal-CV harness for site eims_castle (mix vs ncep-gfs), but architecture is split between the new experiments runner and a legacy production-style pipeline. The benchmarking path is reproducible but still incomplete: train+valid drives selection while test is not integrated into runner decisions, some config keys are not consumed, and fold semantics differ between holdout and CV artifacts.", "target_state": "Unified and documented experimentation platform with strict temporal CV, explicit test-stage promotion, consistent artifact semantics, and repeatable cross-site model evaluation.", "full_context": {"product": "P-Zerø", "category": "Experimentation & Development", "description": "Primary experimentation system for comparing weather-source-specific models and ML baselines under time-ordered validation. Active entrypoint is run_experiments.py with experiments/ modules (temporal_cv, feature_builder, scoring, diagnostics), while pipeline.py and run_baseline_validation.py remain legacy but operationally relevant.", "current_problem": "Parallel experiment architectures and partial runner gaps create decision friction (test split not wired into selection, config/features drift, inconsistent fold-definition semantics, and environment setup quirks like PYTHONPATH-dependent tests).", "impact": "Model conclusions can diverge between holdout and CV regimes, slowing confident promotion decisions and reducing comparability across experiments.", "target": "Single governed experimentation framework with standardized data contracts, consistent CV/test flow, registry-quality metadata, and extensible roadmap support (source fusion, stacking, residual diagnostics, and richer temporal features).", "importance": "Critical"}}, {"id": "cat_monitoring", "type": "category", "name": "Monitoring & Observability", "product_id": "prd_pzero", "category_id": "cat_monitoring", "parent_id": "prd_pzero", "health": "red", "current_state": "Dashboards exist but active response is weak.", "target_state": "Always-on monitoring with alerts and ownership.", "full_context": {"product": "P-Zerø", "category": "Monitoring & Observability", "description": "Operational visibility and anomaly response.", "current_problem": "Signals are underused.", "impact": "Delayed incident detection.", "target": "Proactive alerting and triage loops.", "importance": "Critical"}}, {"id": "cat_performance", "type": "category", "name": "Performance & Evaluation", "product_id": "prd_pzero", "category_id": "cat_performance", "parent_id": "prd_pzero", "health": "red", "current_state": "Evaluation exists; historical tracking incomplete.", "target_state": "Continuous performance intelligence.", "full_context": {"product": "P-Zerø", "category": "Performance & Evaluation", "description": "Forecast quality measurement and trend analysis.", "current_problem": "History is fragmented.", "impact": "Regressions are harder to detect.", "target": "Full historical performance tracking.", "importance": "Critical"}}, {"id": "cat_tooling", "type": "category", "name": "Tooling Ecosystem", "product_id": "prd_pzero", "category_id": "cat_tooling", "parent_id": "prd_pzero", "health": "yellow", "current_state": "PZERO-tooling is actively used as an operations-focused Streamlit toolbox across the wind forecasting lifecycle: weather extraction, Athena datalake querying, submission QA, and SHAP-based prediction diagnostics. The tools are functional and cover core day-to-day workflows, but user experience, shared conventions, and configuration patterns still vary across apps.", "target_state": "Standardized tooling interfaces and ownership.", "full_context": {"product": "P-Zerø", "category": "Tooling Ecosystem", "description": "Collection of lightweight operational utilities that support forecast data ingestion, data-quality validation, datalake exploration, submission behavior diagnostics, and model explainability. The ecosystem is intentionally modular and app-centric, with each tool solving a specific workflow step while sharing the same product context.", "current_problem": "Inconsistent standards.", "impact": "Maintenance overhead.", "target": "Unified tool conventions.", "importance": "Medium"}}, {"id": "cat_business", "type": "category", "name": "Business Layer", "product_id": "prd_pzero", "category_id": "cat_business", "parent_id": "prd_pzero", "health": "red", "current_state": "Customers exist but pricing and payments are immature.", "target_state": "Stable commercial operating system.", "full_context": {"product": "P-Zerø", "category": "Business Layer", "description": "Pricing, payment, contracts, customer value.", "current_problem": "No structured pricing/payment system.", "impact": "Revenue scalability risk.", "target": "Repeatable commercial model.", "importance": "Critical"}}, {"id": "cat_docs", "type": "category", "name": "Documentation & Knowledge", "product_id": "prd_pzero", "category_id": "cat_docs", "parent_id": "prd_pzero", "health": "yellow", "current_state": "Docs exist, visibility map is partial.", "target_state": "Living and complete product map.", "full_context": {"product": "P-Zerø", "category": "Documentation & Knowledge", "description": "Knowledge management and product visibility.", "current_problem": "Incomplete unified visibility.", "impact": "Prioritization misalignment.", "target": "Continuous single source of truth.", "importance": "High"}}, {"id": "sub_aws_lambda", "type": "subcategory", "name": "AWS Lambda Deployment", "product_id": "prd_pzero", "category_id": "cat_infra", "parent_id": "cat_infra", "health": "green", "current_state": "AWS Lambda is sufficient for reliable and stable deployments. Deployment currently uses SAM + CloudFormation with container-image Lambdas and explicit dev/prod stack separation; non-prod runtime is configured for more verbose logs and internal email routing behavior.", "target_state": "None", "full_context": {"description": "The method used to deliver forecasts accurately and reliably to the customer/ESKOM/NTCSA. Invocation paths include API Gateway `POST /forecast` (API key protected) and Step Functions-triggered daily/weekly inference Lambda runs, with schedules currently requiring explicit enablement."}}, {"id": "sub_sam_repo", "type": "subcategory", "name": "Deployment Repository (AWS SAM)", "product_id": "prd_pzero", "category_id": "cat_infra", "parent_id": "cat_infra", "health": "green", "current_state": "Currently the sylvan GitHub account with repositories for each site/customer\n\nhttps://github.com/sylvan-falx. Deploy workflow uses `sam deploy --config-env dev` and `sam deploy --config-env prod`, with local developer emulation via `sam local invoke`; SAM config defines separate dev/prod stacks from the same parameterized template.", "target_state": "Still need to decide between a unified repo for the deployment and repo per site.", "full_context": {"description": "The account/repositories/version control for the deployment framework. Known operational risks include runtime/config drift (for example Python version mismatch between Dockerfile and template metadata), cross-repo naming inconsistencies (`aurora` references in some config artifacts), and weak secret hygiene where API keys appear directly in documentation scripts."}}, {"id": "sub_inference_datalake", "type": "subcategory", "name": "Inference Datalake", "product_id": "prd_pzero", "category_id": "cat_data", "parent_id": "cat_data", "health": "green", "current_state": "Inference datalake is operational and on the FALX AWS Infrastructure account, where it is partitioned and easily accessable by quering the datalake with the Datalake Tool. Data arrivals are tied to deployed inference execution modes (API and scheduler-driven runs), while scheduled daily/weekly triggers remain disabled until explicitly turned on.", "target_state": "None", "full_context": {"description": "Inference data storage and access. This node is the operational sink for deployed forecasting outputs and needs to stay query-friendly for Athena-based QA, submission checks, and cross-environment (dev/prod) traceability."}}, {"id": "sub_training_storage", "type": "subcategory", "name": "Training Data Storage", "product_id": "prd_pzero", "category_id": "cat_data", "parent_id": "cat_data", "health": "yellow", "current_state": "Training data is on the FALX AWS Main account, stored in S3 when training a model. The production and meteo data is currently split. This remains separate from inference datalake storage, which increases friction when tracing deployed inference behavior back to exact training snapshots and feature states.", "target_state": "Version controlled datasets with easy linking between meteo and production data", "full_context": {"description": "Storage for training datasets. Requires stronger linkage to inference datalake partitions and deployment-environment metadata so training-to-inference reproducibility is auditable."}}, {"id": "sub_data_versioning", "type": "subcategory", "name": "Data Versioning", "product_id": "prd_pzero", "category_id": "cat_data", "parent_id": "cat_data", "health": "red", "current_state": "Version control for datasets in the AWS platform. Training datasets get overwritten when training a new model and old datasets are lost.", "target_state": "Immutable versioned dataset snapshots in AWS with dates and possible concatenation of datasets to create a more complete training data set.", "full_context": {"description": "Version control for datasets in the AWS platform, which is curre"}}, {"id": "sub_legacy_metalearner", "type": "subcategory", "name": "Legacy Metalearner (XGBoost/LightGBM)", "product_id": "prd_pzero", "category_id": "cat_modeling", "parent_id": "cat_modeling", "health": "yellow", "current_state": "The active training flow is a stacked ensemble: for each configured weather source (for example mix, ncep-gfs) a base learner is trained, then a meta-learner is trained on base predictions to produce final site forecasts. Two parallel model families (XGB and LGBM) implement the same workflow and output conventions. Preprocessing is consistent across families: production and meteo are timezone-normalized and resampled, meteo intervals are left-aligned, merged rows with missing values are dropped, a common overlap window is enforced across weather sources, and train/validation uses a time-ordered 80/20 split. Wind-speed anomaly detection is run in configured rounds, with behavior controlled by anomaly_handling_mode (visualize-only or remove-for-training).", "target_state": "Governed and benchmarked lifecycle.", "full_context": {"product": "P-Zerø", "category": "Modeling & Training", "subcategory": "Legacy Metalearner (XGBoost/LightGBM)", "description": "Legacy metalearner node captures the current operational stacked-ensemble architecture and its historical evolution. The repo contains earlier generations under older/ (v0.0.0 and v0.0.1) with prior XGBoost and polynomial power-curve paths, while top-level scripts represent a cleaner operational evolution with URI-based I/O, stronger artifact handling, standardized model-family suffixing, and integration into deployment/test flows.", "current_problem": "Upgrade path is unclear.", "impact": "Maintainability risk.", "target": "Controlled evolution.", "importance": "High"}}, {"id": "sub_feature_engineering", "type": "subcategory", "name": "Feature Engineering", "product_id": "prd_pzero", "category_id": "cat_modeling", "parent_id": "cat_modeling", "health": "green", "current_state": "Feature engineering capability is broad in code but partially active in runtime. Implemented blocks include time features, cyclical encodings, Fourier terms, wind-vector decomposition (u/v), lag features, rolling statistics, and interaction features. In current LGBM/XGB training scripts, many transforms in transform() are intentionally disabled/commented, so the effective feature set is primarily cleaned/resampled meteo inputs from settings plus explicit downstream additions where configured.", "target_state": "Keep expanding tested features.", "full_context": {"product": "P-Zerø", "category": "Modeling & Training", "subcategory": "Feature Engineering", "description": "Feature engineering layer transforms raw meteo and site signals into model-ready predictors, while diagnostics support feature understanding through lag-correlation analysis, feature-vs-production plots, and feature-importance outputs. Current operational emphasis is reliability and comparability over maximal feature complexity, with richer transforms available for controlled reactivation during experimentation.", "current_problem": "Needs ongoing drift checks.", "impact": "Core driver of accuracy.", "target": "Scalable and explainable feature pipeline.", "importance": "Critical"}}, {"id": "sub_weather_benchmark", "type": "subcategory", "name": "Weather Data Benchmarking", "product_id": "prd_pzero", "category_id": "cat_modeling", "parent_id": "cat_modeling", "health": "green", "current_state": "Weather benchmarking is implemented through per-weather-model base learners trained in parallel for each configured source. Each source logs model-specific metrics (MAE, RMSE, nMAE, nRMSE, R2, penalty), and lag-correlation diagnostics provide pre-training signal comparisons. The meta-learner then benchmarks combined value by learning weighted/nonlinear combinations of base outputs. Practical caveat: ClearML captures detailed per-model metrics, while metrics.csv is currently focused mainly on final ensemble summaries.", "target_state": "Automated benchmark scorecards.", "full_context": {"product": "P-Zerø", "category": "Modeling & Training", "subcategory": "Weather Data Benchmarking", "description": "Benchmarking node represents implicit competitive evaluation of weather data providers via model performance, not only static data QA. It measures source-level predictive contribution and incremental value in the stacked ensemble, enabling evidence-based weather-source selection and blend strategy decisions at site level.", "current_problem": "Cadence not fully automated.", "impact": "Source choice speed reduced.", "target": "Automated benchmarking loop.", "importance": "High"}}, {"id": "sub_model_versioning", "type": "subcategory", "name": "Model Versioning", "product_id": "prd_pzero", "category_id": "cat_modeling", "parent_id": "cat_modeling", "health": "red", "current_state": "Versioning is artifact-centric and model-family-aware but not yet a full registry. Outputs are suffixed by family (_xgb, _lgbm), stored in site-scoped artifact folders (models, plots, metrics), and uploaded to suffixed S3 paths. Pipeline binaries are exported with site+family naming conventions, environment snapshots are tracked via pip freeze artifacts, and SHAP background datasets/metadata are versioned as separate artifacts. Promotion to dev is explicit through push_to_dev.py by copying selected family artifacts to dev_uri with optional API validation, and older/ provides historical code snapshots.", "target_state": "Formal model registry.", "full_context": {"product": "P-Zerø", "category": "Modeling & Training", "subcategory": "Model Versioning", "description": "Model versioning currently manages provenance through structured artifacts, suffix conventions, site-scoped storage, and controlled promotion scripts. The missing piece is a formal immutable registry that unifies model artifact identifiers with exact dataset versions, feature configuration, training metadata, and comparable performance records across releases.", "current_problem": "No immutable model history.", "impact": "Rollback/comparison risk.", "target": "Registry with data+metrics linkage.", "importance": "Critical"}}, {"id": "sub_codex_cli", "type": "subcategory", "name": "CODEX CLI Setup", "product_id": "prd_pzero", "category_id": "cat_experiment", "parent_id": "cat_experiment", "health       subs.forEach((sub, sIdx) => {
        const subAngle = subs.length === 1 ? catAngle : catAngle - arc / 2 + (arc * sIdx / (subs.length - 1));
        const pSub = { x: pCat.x + polar(subRadius, subAngle).x, y: pCat.y + polar(subRadius, subAngle).y };
        addNode({ id: sub.id, kind: "entity", entityType: sub.type, name: sub.name, health: sub.health, description: sub.full_context?.description || "", current_state: sub.current_state || "", target_state: sub.target_state || "", raw: sub }, pSub.x, pSub.y, 11);
        treeEdges.push({ from: cat.id, to: sub.id });

        const tList = tasksByEntity[sub.id] || [];
        const tArc = Math.min(70, 22 * Math.max(2, tList.length));
        const tRadius = 160;
        tList.forEach((task, tIdx) => {
          const tAngle = tList.length === 1 ? subAngle : subAngle - tArc / 2 + (tArc * tIdx / (tList.length - 1));
          const pTask = { x: pSub.x + polar(tRadius, tAngle).x, y: pSub.y + polar(tRadius, tAngle).y };
          const taskId = "task:" + task.id;
          addNode({
            id: taskId,
            kind: "task",
            entityType: "task",
            name: task.title,
            health: null,
            priority: task.priority,
            status: task.status,
            description: task.description || "",
            current_state: "",
            target_state: "",
            raw: task
          }, pTask.x, pTask.y, 7);
          treeEdges.push({ from: sub.id, to: taskId });
        });
      });
    });

    function relPath(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const curve = 0.22;
      const cx = mx - dy * curve;
      const cy = my + dx * curve;
      return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
    }

    function colorForNode(n) {
      if (n.kind === "task") return "#6fa8ff";
      return healthColor[n.health] || "#adbcd6";
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function formatTitle(meta) {
      if (meta.kind === "task") return meta.name;
      return meta.name;
    }

    function clearDetails() {
      detail.innerHTML = "";
    }

    function updateDetails(meta, relInfo = null) {
      clearDetails();
      if (relInfo) {
        detail.appendChild(el("h2", "", "Relationship"));
        const m = el("div", "meta", `${relInfo.type}`);
        detail.appendChild(m);
        detail.appendChild(el("div", "section-title", "From"));
        detail.appendChild(el("p", "text", relInfo.fromName));
        detail.appendChild(el("div", "section-title", "To"));
        detail.appendChild(el("p", "text", relInfo.toName));
        detail.appendChild(el("div", "section-title", "Description"));
        detail.appendChild(el("p", "text", relInfo.description || "No description."));
        return;
      }

      detail.appendChild(el("h2", "", formatTitle(meta)));
      const metaLine = [];
      if (meta.entityType) metaLine.push(meta.entityType);
      if (meta.kind === "task") {
        metaLine.push(meta.priority || "n/a");
        metaLine.push(meta.status || "n/a");
      }
      detail.appendChild(el("div", "meta", metaLine.join(" | ")));

      if (meta.health) {
        const chip = el("span", "chip " + meta.health, meta.health.toUpperCase());
        detail.appendChild(chip);
      }
      if (meta.description) {
        detail.appendChild(el("div", "section-title", "Description"));
        detail.appendChild(el("p", "text", meta.description));
      }
      if (meta.current_state) {
        detail.appendChild(el("div", "section-title", "Current State"));
        detail.appendChild(el("p", "text", meta.current_state));
      }
      if (meta.target_state) {
        detail.appendChild(el("div", "section-title", "Target State"));
        detail.appendChild(el("p", "text", meta.target_state));
      }
      const ctx = meta.raw?.full_context;
      if (ctx) {
        detail.appendChild(el("div", "section-title", "Context"));
        Object.entries(ctx).forEach(([k, v]) => {
          if (typeof v !== "string" || !v) return;
          detail.appendChild(el("p", "text", `${k}: ${v}`));
        });
      }
    }

    function showTooltip(evt, html) {
      tooltip.innerHTML = html;
      tooltip.style.display = "block";
      tooltip.style.left = `${evt.clientX + 12}px`;
      tooltip.style.top = `${evt.clientY + 12}px`;
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function render() {
      viewport.innerHTML = "";
      treeEdges.forEach(edge => {
        const a = positions[edge.from];
        const b = positions[edge.to];
        mkEl("path", {
          d: `M ${a.x} ${a.y} L ${b.x} ${b.y}`,
          class: "edge"
        }, viewport);
      });

      DATA.relationships.forEach(rel => {
        const a = positions[rel.from_id];
        const b = positions[rel.to_id];
        if (!a || !b) return;
        const line = mkEl("path", {
          d: relPath(a, b),
          class: "edge rel",
          stroke: relColor[rel.type] || "#c0c8d5"
        }, viewport);
        line.addEventListener("mousemove", evt => {
          const fromName = entitiesById[rel.from_id]?.name || rel.from_id;
          const toName = entitiesById[rel.to_id]?.name || rel.to_id;
          showTooltip(evt, `<strong>${rel.type}</strong><br/>${fromName} → ${toName}`);
        });
        line.addEventListener("mouseleave", hideTooltip);
        line.addEventListener("mouseenter", () => {
          updateDetails(null, {
            type: rel.type,
            fromName: entitiesById[rel.from_id]?.name || rel.from_id,
            toName: entitiesById[rel.to_id]?.name || rel.to_id,
            description: rel.description || ""
          });
        });
      });

      nodes.forEach(n => {
        const g = mkEl("g", {
          class: `node ${n.kind}`,
          transform: `translate(${n.x}, ${n.y})`
        }, viewport);

        mkEl("circle", {
          r: n.r,
          fill: colorForNode(n)
        }, g);

        const label = n.kind === "task"
          ? `[${(n.priority || "").toUpperCase()}] ${n.name}`
          : n.name;
        mkEl("text", {
          x: n.r + 5,
          y: 4
        }, g).textContent = label.length > 56 ? label.slice(0, 56) + "…" : label;

        g.addEventListener("mouseenter", evt => {
          const summary = n.description || n.current_state || "No description.";
          showTooltip(evt, `<strong>${n.name}</strong><br/>${summary}`);
          updateDetails(n);
        });
        g.addEventListener("mousemove", evt => {
          tooltip.style.left = `${evt.clientX + 12}px`;
          tooltip.style.top = `${evt.clientY + 12}px`;
        });
        g.addEventListener("mouseleave", hideTooltip);
      });

      updateDetails(nodeMeta[root.id]);
      applyTransform();
    }

    function applyTransform() {
      viewport.setAttribute("transform", `translate(${interaction.x}, ${interaction.y}) scale(${interaction.scale})`);
    }

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let baseX = 0;
    let baseY = 0;

    svg.addEventListener("mousedown", evt => {
      dragging = true;
      svg.classList.add("dragging");
      startX = evt.clientX;
      startY = evt.clientY;
      baseX = interaction.x;
      baseY = interaction.y;
    });
    window.addEventListener("mouseup", () => {
      dragging = false;
      svg.classList.remove("dragging");
    });
    window.addEventListener("mousemove", evt => {
      if (!dragging) return;
      interaction.x = baseX + (evt.clientX - startX);
      interaction.y = baseY + (evt.clientY - startY);
      applyTransform();
    });
    svg.addEventListener("wheel", evt => {
      evt.preventDefault();
      const factor = evt.deltaY < 0 ? 1.08 : 0.92;
      interaction.scale = Math.max(0.35, Math.min(2.4, interaction.scale * factor));
      applyTransform();
    }, { passive: false });

    resetBtn.addEventListener("click", () => {
      interaction.x = 0;
      interaction.y = 0;
      interaction.scale = 1;
      applyTransform();
    });

    render();
  </script>
</body>
</html>
